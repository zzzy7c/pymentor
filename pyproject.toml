[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyassist"
version = "0.1.0"
description = "Python AI 学习助手：文档问答 / 错误诊断 / 练习批改 / 学习路径"
requires-python = ">=3.12"
# readme 暂不声明：README.md 是阶段八产物，此处声明会让构建失败
dependencies = [
  # Agent 编排（阶段二起）
  "langgraph>=1.1,<2.0",
  "langchain-core>=1.3,<2.0",
  "langchain-deepseek>=1.0",
  # 检查点（阶段三）
  "langgraph-checkpoint-sqlite>=2.0,<3.0",
  "langgraph-checkpoint-postgres>=2.0,<3.0",
  # 持久化的驱动与扩展（阶段三）。这三件是我们**自己的代码直接依赖**的东西：
  # db/session.py 的 sqlite+aiosqlite 方言、agent/store.py 经 langgraph.store.sqlite
  # 对 sqlite-vec 的模块级硬导入、生产分支对 psycopg 的直接调用。它们恰好也被上面
  # 两个包声明为 Requires-Dist —— 由别人替我们声明，上游哪天换实现时不会有依赖解析
  # 错误，只会静默崩。故提升为直接声明（SPEC 待定项 9）。
  # 上界 <0.22 是**兼容性钉**，不是随意的：aiosqlite 0.22 起不再继承 threading.Thread，
  # 于是 Connection.is_alive() 消失；而 langgraph-checkpoint-sqlite 2.0.11 的
  # AsyncSqliteSaver.setup() 仍然调它（上游声明 aiosqlite>=0.20 时不带上界，是个漏洞）。
  # 升到 0.22 会让 `graph.ainvoke` 在首次懒 setup 时 AttributeError。见 SPEC 待定项 9 复注。
  "aiosqlite>=0.20,<0.22",
  # 注意：分发名是 sqlite-vec（短横线），import 名是 sqlite_vec（下划线）
  "sqlite-vec>=0.1.6,<1.0",
  # [binary] 在 Windows 上捆绑 libpq；[pool] 提供 AsyncConnectionPool
  "psycopg[binary,pool]>=3.2,<4.0",
  # LLM 传输：仅启动时模型名校验用，业务代码不得直调（§2）
  "openai>=1.50,<2.0",
  # API（阶段四 / 六）
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "slowapi>=0.1.9",
  # 数据（阶段三 / 五）
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.4,<3.0",
  # [asyncio] 带来 greenlet —— sqlalchemy.ext.asyncio 的硬运行时前提（阶段三 db/session.py）。
  # 这不是"顺手加的 extra"：没有它，create_async_engine 在 import 期就 ImportError。
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "alembic>=1.13",
  "chromadb>=0.5",
  # 唯一向量化实现（阶段五）。DeepSeek 不提供 embedding 接口（§1），故必须另选。
  "sentence-transformers>=3.0,<4.0",
  # 语料 HTML → 结构化块（阶段五）。用标准库 html.parser 解析，不引 lxml。
  "beautifulsoup4>=4.12,<5.0",
  # 通用（阶段一起就在用）
  "jinja2>=3.1",
  "structlog>=24.1",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "docker>=7.1",
]

[dependency-groups]
# 前端（阶段八）。**刻意不放进 project.dependencies**：api 镜像按
# `uv sync --frozen --no-dev` 装全部主依赖，把 streamlit 塞进去等于让后端镜像
# 多背一个前端框架；web 镜像按 `--only-group web` 只装这两件（SPEC §5.16）。
# 本地要跑前端：`uv sync --group web`。
web = [
  "streamlit>=1.57",
  "httpx>=0.27",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyassist"]

# ---------- torch 钉到 CPU 索引（阶段五，SPEC D1）----------
# Windows 上 PyPI 默认给的是 CUDA 轮子（约 2.5GB）。开发机不跑 GPU 推理，
# 白下 2.3GB 毫无意义。该索引不可达时删掉这一节，接受大轮子（SPEC R2）。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# ---------- lint ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# data / alembic 自动生成：运行产物
# *.md：ruff 0.16 会把 Markdown 代码块里的 Python 一并格式化 —— 那会改写 SPEC.md 等契约
#   文档的示例代码。文档不是代码，排除。（契约也要求文档不进任何自动闸门，见 SPEC §5.6）
extend-exclude = ["data", "migrations/versions", "*.md"]

[tool.ruff.lint]
select = [
  "E", "W",     # pycodestyle
  "F",          # pyflakes
  "I",          # import 排序
  "N",          # 命名规范（§3.3）
  "UP",         # pyupgrade，锁 3.12 语法
  "B",          # bugbear
  "A",          # 内建名遮蔽
  "C4",         # comprehension
  "SIM",        # 化简
  "PT",         # pytest 风格
  "RUF",        # ruff 自有规则
  "ASYNC",      # 异步陷阱（阶段六的流式铁律靠它兜底）
  "S",          # bandit：exec/eval/subprocess 等（§4 禁区）
]

# RUF001/002/003 = "ambiguous unicode character"（全角括号、逗号、冒号等）。
# 本项目注释与文案为中文，全角标点是正常书写，这三条只会产生噪音。
# 这是 SPEC §5.1 的疏漏：它一边要求中文 docstring，一边开着 RUF 全集。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]        # 测试里 assert 是本体
# 异常类名由 AGENTS.md §3.2 冻结（RetrievalEmpty / LLMTimeout / …），不叫 *Error 是刻意的：
# 名字本身在表达"这是业务结果"而非"这是故障"。N818 与契约冲突，本文件豁免。
"src/pyassist/errors.py" = ["N818"]
# 一次性实验：允许 print（§3.5 对 experiments 的豁免）。
# E402：实验脚本按路径直接跑，需要先 `sys.path.insert` 到 src/ 与 tests/ 才能 import
# pyassist 与 fakes —— 这段路径设置**必须**在 import 之前，否则脚本在没装包的环境里跑不起来。
"experiments/**" = ["S", "T20", "E402"]
# S108 命中的是**容器内**的 /tmp（tmpfs 挂载点与 HOME/TMPDIR），不是宿主机临时目录。
# 它的安全性恰恰来自 runner 的 noexec/nosuid/size 参数，不是靠"换个路径"。
"src/pyassist/sandbox/runner.py" = ["S108"]
"scripts/**" = ["S607"]      # 提交钩子脚本，用裸 "git" 便于跨机器复用

# ---------- 类型 ----------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pyassist"]
plugins = ["pydantic.mypy"]

# sentence-transformers / torch / bs4 均无 stub。放行 import 检查；
# **但 Any 返回值必须在函数内落到显式注解的局部变量**（SPEC §5.2 的 vectors 陷阱），
# 不允许用 `# type: ignore` 抹平判据 18（SPEC R7）。
[[tool.mypy.overrides]]
# docker 7.2.0 分发里**没有** py.typed（T0 实测），与上面三个同理放行 import 检查。
# 容器参数的 `Any` 一律在 `sandbox/runner.py` 内落到显式注解的局部变量/返回值。
module = ["sentence_transformers.*", "torch.*", "bs4.*", "docker.*"]
ignore_missing_imports = true

# ---------- 测试 ----------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `-m 'not docker'`：真实隔离测试默认不跑（daemon 可能没起）。显式跑：
#   pytest -m docker tests/test_sandbox_docker.py
addopts = "-q --strict-markers --strict-config -m 'not docker'"
markers = [
  "docker: 需要真实 Docker 守护进程（阶段七）",
]
